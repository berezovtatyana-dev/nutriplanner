<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>{% block title %}Nutriplanner{% endblock %}</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'product_list' %}">
                NutriPlanner
            </a>
            <div class="navbar-nav ms-auto">
                <a href="{% url 'product_list' %}"
                class="nav-link text-white">
                    Каталог продуктов
                </a>
                <a href="{% url 'meal_detail_plan' %}"
                class="btn btn-warning ms-3 fw-bold"
                >
                    Мой дневной рацион
                </a>
            </div>
        </div>
    </nav>
<div class="container">
    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" area-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
</div>
{% block content %}

{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
